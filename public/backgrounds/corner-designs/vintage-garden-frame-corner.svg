<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Antique Parchment Linen Background -->
    <linearGradient id="vintagePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8EE" />
      <stop offset="35%" stop-color="#F7EEDC" />
      <stop offset="70%" stop-color="#F2E3CA" />
      <stop offset="100%" stop-color="#EAD9BD" />
    </linearGradient>

    <!-- Warm Vignette Glow -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#F9F1E2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D7BE93" stop-opacity="0.35" />
    </radialGradient>

    <!-- Vintage Antique Gold -->
    <linearGradient id="antiqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E0A4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#805F04" />
    </linearGradient>

    <!-- Botanical Sage & Olive -->
    <linearGradient id="vintageOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3B18A" />
      <stop offset="50%" stop-color="#588157" />
      <stop offset="100%" stop-color="#3A5A40" />
    </linearGradient>

    <linearGradient id="vintageRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE2E4" />
      <stop offset="45%" stop-color="#E29578" />
      <stop offset="100%" stop-color="#B25D4E" />
    </linearGradient>

    <filter id="vintageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#4A3B22" flood-opacity="0.18" />
    </filter>

    <!-- Victorian Botanical Corner Flourish -->
    <g id="vintageCornerPiece">
      <!-- Ornate Scrollwork -->
      <path d="M0,0 C45,0 90,15 130,45 C170,75 195,120 210,170 C195,160 170,145 140,140 C110,135 70,145 45,170 C50,135 60,95 40,65 C20,35 0,0 0,0 Z" fill="url(#antiqueGold)" opacity="0.85" />
      <path d="M25,25 C65,25 105,40 140,70 C175,100 195,140 200,180 C185,170 165,160 140,155 C115,150 80,155 60,175 C65,145 75,110 55,85 C35,60 25,25 25,25 Z" fill="none" stroke="url(#antiqueGold)" stroke-width="2.5" />
      
      <!-- Botanical English Garden Leaves -->
      <path d="M40,90 Q90,75 125,115 Q80,140 40,90 Z" fill="url(#vintageOlive)" />
      <path d="M90,40 Q75,90 115,125 Q140,80 90,40 Z" fill="url(#vintageOlive)" opacity="0.9" />
      <path d="M85,130 Q145,120 180,165 Q135,190 85,130 Z" fill="url(#vintageOlive)" />
      <path d="M130,85 Q120,145 165,180 Q190,135 130,85 Z" fill="url(#vintageOlive)" opacity="0.9" />

      <!-- Antique Tea Rose at apex -->
      <circle cx="95" cy="95" r="32" fill="url(#vintageRose)" />
      <path d="M75,95 C75,70 115,70 115,95 C115,115 75,115 75,95 Z" fill="#9C4436" opacity="0.5" />
      <circle cx="95" cy="95" r="14" fill="#C16654" />
      <circle cx="95" cy="95" r="6" fill="#FDF0ED" />

      <!-- Delicate Ivy Tendrils -->
      <path d="M210,170 Q240,210 230,260 Q215,240 200,230" fill="none" stroke="url(#vintageOlive)" stroke-width="3" stroke-linecap="round" />
      <path d="M170,210 Q210,240 260,230 Q240,215 230,200" fill="none" stroke="url(#vintageOlive)" stroke-width="3" stroke-linecap="round" />
    </g>
  </defs>

  <!-- 1. Vintage Paper Canvas -->
  <rect width="1080" height="1920" fill="url(#vintagePaper)" />
  <rect width="1080" height="1920" fill="url(#vignette)" />

  <!-- 2. Dual Victorian Framing Borders -->
  <rect x="52" y="52" width="976" height="1816" fill="none" stroke="url(#antiqueGold)" stroke-width="3.5" opacity="0.75" />
  <rect x="68" y="68" width="944" height="1784" fill="none" stroke="url(#antiqueGold)" stroke-width="1.2" stroke-dasharray="8 5" opacity="0.6" />
  <rect x="80" y="80" width="920" height="1760" fill="none" stroke="#B89758" stroke-width="0.8" opacity="0.4" />

  <!-- Corner Flourishes in all 4 corners -->
  <!-- Top-Left -->
  <g transform="translate(68, 68)" filter="url(#vintageShadow)">
    <use href="#vintageCornerPiece" />
  </g>

  <!-- Top-Right -->
  <g transform="translate(1012, 68) scale(-1, 1)" filter="url(#vintageShadow)">
    <use href="#vintageCornerPiece" />
  </g>

  <!-- Bottom-Left -->
  <g transform="translate(68, 1852) scale(1, -1)" filter="url(#vintageShadow)">
    <use href="#vintageCornerPiece" />
  </g>

  <!-- Bottom-Right -->
  <g transform="translate(1012, 1852) scale(-1, -1)" filter="url(#vintageShadow)">
    <use href="#vintageCornerPiece" />
  </g>

  <!-- Top and Bottom Delicate Center Ornamental Badges -->
  <g transform="translate(540, 68)" filter="url(#vintageShadow)">
    <path d="M-60,0 C-30,12 0,22 0,22 C0,22 30,12 60,0 C30,-12 0,-22 0,-22 C0,-22 -30,-12 -60,0 Z" fill="url(#antiqueGold)" opacity="0.8" />
    <circle cx="0" cy="0" r="5" fill="#FFF8EE" />
  </g>
  <g transform="translate(540, 1852)" filter="url(#vintageShadow)">
    <path d="M-60,0 C-30,-12 0,-22 0,-22 C0,-22 30,-12 60,0 C30,12 0,22 0,22 C0,22 -30,12 -60,0 Z" fill="url(#antiqueGold)" opacity="0.8" />
    <circle cx="0" cy="0" r="5" fill="#FFF8EE" />
  </g>
</svg>